name: pages-check

on:
  schedule:
    # hourly, round the clock (:37 past every hour UTC)
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "yes = send a sample price-drop alert"
        default: "no"

permissions:
  contents: write
  issues: write

concurrency:
  group: pages-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install playwright
        run: pip install --quiet playwright
      - name: cache the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-v2
      - name: install the browser
        run: playwright install chromium --only-shell
      - name: write config from the encrypted secret
        env:
          ACCOR_CONFIG: ${{ secrets.ACCOR_CONFIG }}
        run: printf '%s' "$ACCOR_CONFIG" > config.json
      - name: write a sample alert (test mode)
        if: inputs.test_alert == 'yes'
        run: |
          printf 'no' > has_drops.txt
          printf '%s' "TEST — sample alert" > email_subject.txt
          cat > email_body.md <<'MD'
          A watched hotel is now cheaper than what you booked.

          ### Swissôtel Amsterdam
          16 Sep → 19 Sep 2026 · 3 night(s)

          - now **₹111,700** (you booked at ₹114,894)
          - **save ₹3,194**
          - rebook, then cancel `QNTLDDSM`
          - points on the new booking: up to **44,000**

          **Book the new flexible rate first, confirm it, then cancel the old booking.**

          [Open the dashboard](https://rohangautam09.github.io/accor-price-watch/)

          _This is a TEST — example numbers. Real alerts look exactly like this._
          MD

      - name: fetch prices and build the dashboard
        if: inputs.test_alert != 'yes'
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
        run: python pages_build.py
      - name: publish
        continue-on-error: true
        run: |
          rm -f config.json
          git config user.name "accor-bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "prices $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase -q || true
          git push || true
      - name: email this check (drops, movement, or "no change")
        if: hashFiles('email_body.md') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # exactly one notification per run: create the issue and leave
          # it alone (closing or commenting would each send another email)
          URL=$(gh issue create --repo "$GITHUB_REPOSITORY" \
                  --label "$([ "$(cat has_drops.txt)" = yes ] && echo drop || echo routine)" \
                  --title "$(cat email_subject.txt)" \
                  --body-file email_body.md)
          echo "sent: $URL"

      - name: tidy up old routine issues (deleting never emails)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KEEP=$(gh issue list --repo "$GITHUB_REPOSITORY" --label routine \
                   --state all --limit 1 --json number --jq '.[0].number')
          for N in $(gh issue list --repo "$GITHUB_REPOSITORY" --label routine \
                       --state all --limit 100 --json number --jq '.[].number'); do
            [ "$N" = "$KEEP" ] && continue
            ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$N" --jq .node_id)
            gh api graphql -f query='mutation($id:ID!){deleteIssue(input:{issueId:$id}){clientMutationId}}' \
              -f id="$ID" >/dev/null 2>&1 \
              && echo "deleted #$N" || echo "could not delete #$N"
          done
