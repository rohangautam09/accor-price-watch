name: pages-check

on:
  schedule:
    # hourly, round the clock (:37 past every hour UTC)
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: pages-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install playwright
        run: pip install --quiet playwright
      - name: cache the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-v2
      - name: install the browser
        run: playwright install chromium --only-shell
      - name: write config from the encrypted secret
        env:
          ACCOR_CONFIG: ${{ secrets.ACCOR_CONFIG }}
        run: printf '%s' "$ACCOR_CONFIG" > config.json
      - name: fetch prices and build the dashboard
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
        run: python pages_build.py
      - name: publish
        continue-on-error: true
        run: |
          rm -f config.json
          git config user.name "accor-bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "prices $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase -q || true
          git push || true
      - name: email a price-drop alert (via a GitHub issue)
        if: hashFiles('alert.md') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "👀 Bhai Accor check kar — price drop!" \
            --body-file alert.md
